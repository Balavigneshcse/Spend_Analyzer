# Local development: local PostgreSQL, OTP codes printed in the console, plain http cookie.
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:spend_analyzer}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

app.origin=
app.cookie.secure=false
app.mail.provider=console
app.mail.from-email=dev@localhost
app.mail.from-name=Spend Analyzer (dev)
app.security.otp-pepper=dev-only-pepper-never-use-in-production-0123456789abcdef
