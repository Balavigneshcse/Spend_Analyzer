# Production (Render). The app must fail to start if a secret is missing.
# The database comes from the DATABASE_URL environment variable (see DatabaseUrl.java).
server.forward-headers-strategy=native

app.origin=${APP_ORIGIN:${RENDER_EXTERNAL_URL:}}
app.cookie.secure=true

# Who sends the code emails: "google" (your own Gmail, through the Apps Script in
# deploy/google-apps-script) or "brevo". The settings of both are empty by default, so that using
# one never fails on the missing variables of the other. The start-up check (ProductionGuard)
# refuses to start when a setting of the chosen one is missing.
app.mail.provider=${MAIL_PROVIDER:google}
app.mail.google.script-url=${GOOGLE_SCRIPT_URL:}
app.mail.google.secret=${GOOGLE_SCRIPT_SECRET:}
app.mail.brevo.api-key=${BREVO_API_KEY:}
app.mail.from-email=${MAIL_FROM_EMAIL:}
app.mail.from-name=${MAIL_FROM_NAME:Spend Analyzer}

app.security.otp-pepper=${OTP_PEPPER}
