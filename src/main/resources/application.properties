spring.application.name=spend-analyzer
# No profile given -> local development. The Docker image sets SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml
server.tomcat.threads.max=16
server.tomcat.threads.min-spare=2

spring.servlet.multipart.enabled=false
spring.jackson.deserialization.fail-on-unknown-properties=true
# Static pages are tiny: let the browser revalidate so a new deploy is picked up at once.
spring.web.resources.cache.cachecontrol.no-cache=true

# Small pool: the free database and the 512 MB container are both tiny.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.flyway.connect-retries=10

# ---- application settings (overridden per profile) ----
# All "today / this month" maths uses this zone, never the server zone.
app.zone=Asia/Kolkata
# Public origin of the site, e.g. https://spend-analyzer.onrender.com (empty = same host as the request).
app.origin=
app.cookie.secure=true
app.registration-enabled=${APP_REGISTRATION_ENABLED:true}
app.session.days=7
# Log out after this many minutes without activity (1 to 120). The server allows 60 seconds more.
app.session.idle-minutes=5
