# Tests run against the local PostgreSQL in a separate database that is wiped on every run.
# Override the database name with the TEST_DB environment variable.
spring.datasource.url=jdbc:postgresql://localhost:5432/${TEST_DB:spend_analyzer_test}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.flyway.clean-disabled=false

app.origin=
app.cookie.secure=false
app.mail.provider=capture
app.mail.from-email=test@localhost
app.mail.from-name=Spend Analyzer (test)
app.security.otp-pepper=test-only-pepper-0123456789abcdef0123456789abcdef
